<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>دفتر الجامعة</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1018;color:#f2f3fa;font:16px/1.7 system-ui,sans-serif}header,main,footer{max-width:1140px;margin:auto;padding:20px clamp(16px,4vw,44px)}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #303641}header b{font-size:1.35rem}header b:before{content:'◈';color:#bfa2ff;margin-inline-end:.6em}small,label,footer,.muted{color:#afbbcb}h1{font-size:clamp(2.2rem,6vw,4.4rem);line-height:1.18;letter-spacing:-.05em;margin:.35em 0}h2{font-size:1.25rem;margin:0 0 15px}p{margin:8px 0 16px}.hero{border-radius:24px;padding:clamp(20px,5vw,52px);margin:14px 0 22px;background:radial-gradient(ellipse at 4% 90%,#433778,transparent 55%),linear-gradient(125deg,#242e4a,#141e2b);border:1px solid #41445d}.hero small{color:#bcd6dc}.stats,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,185px),1fr));gap:12px}.stats article strong{display:block;font-size:1.8rem;color:#cfbaff;font-variant-numeric:tabular-nums}article,section.panel,details{background:#151d29;border:1px solid #313a49;border-radius:16px;padding:17px;margin:0}nav,.tools,.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}nav{margin:24px 0 16px}button,select,input,textarea{font:inherit;color:inherit;background:#101722;border:1px solid #455265;border-radius:10px;padding:8px 12px}button{cursor:pointer}button:hover,button:focus-visible{border-color:#bb9bf6}button[aria-current=true],button.primary{background:#c8afff;color:#171326;border-color:#c8afff;font-weight:700}section.panel,details{margin:12px 0}label{display:grid;gap:5px;margin:6px 0}input,select{max-width:100%}textarea{width:100%;min-height:6em}table{width:100%;border-collapse:collapse;text-align:right}td,th{padding:10px 6px;border-bottom:1px solid #313a49}th{font-weight:500;color:#bac7d6}.scroll{overflow:auto}.event{border-inline-start:3px solid #a990dd;padding:5px 13px;margin:12px 0}.accent{color:#9fe3de}summary{cursor:pointer;font-weight:bold}.hint{color:#e8bd83}#status:empty{display:none}footer{font-size:.88rem}progress{width:100%;accent-color:#af92e8}form{margin:12px 0}button,input,select{min-height:42px}bdi{white-space:nowrap}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.hero{margin-top:0}.tools>*{flex:1 1 120px}header,main{padding:14px}.panel{padding:13px!important}}
</style>
<header><b>دفتر الجامعة</b><small>جامعة جدة</small></header><main>
<div class="hero"><small>الأمن السيبراني · الفصل <bdi>202701</bdi></small><h1>لوحتي الجامعية</h1><div id="next"></div></div><div class="stats" id="metrics"></div>
<nav aria-label="أقسام اللوحة" id="tabs"></nav><div id="screen"></div><p id="status" role="status" class="hint"></p>
<details id="settings"><summary>بياناتي والنسخة الاحتياطية</summary><p>الصق إعداد الفصل أو نسخة احتياطية لاستعادتها في هذا المتصفح.</p><textarea id="config" aria-label="إعداد الفصل" dir="ltr"></textarea><div class="tools"><button id="restore">استيراد البيانات</button><button id="backup">عرض نسخة للنسخ</button></div></details>
</main><footer>تُحفظ تعديلاتك في المتصفح على هذا الجهاز.</footer>
<script>
'use strict';
const courses=[
['CECY 211','البرمجة الآمنة',4,40],['CECS 217','تنظيم وبنيان الحاسب',4,40],['SCMT 221','الجبر الخطي',3,40],['SCST 210','الإحصاء العام ١',3,40],['ELPR 220','الكتابة الأكاديمية',2,40],['CLAL 100','المهارات اللغوية',2,null],['ISLM 100','الثقافة الإسلامية',2,40],['PRQU 201','الشهادات المهنية والتخصصية',0,null]
];
const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const tabs=['نظرة عامة','المواد والدرجات','الجدول','المواعيد','الحاسبات'];const levels=[['A+',5],['A',4.75],['B+',4.5],['B',4],['C+',3.5],['C',3],['D+',2.5],['D',2],['F',1]];
const key='uj-notebook-v1',el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({gpa:null,hours:0,grades:[],schedule:[],events:[]});
const num=(x,a,b)=>typeof x==='number'&&Number.isFinite(x)&&x>=a&&x<=b;
const course=x=>Number.isInteger(x)&&courses[x]!==undefined;
const tm=x=>typeof x==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(x);
const str=x=>typeof x==='string'&&x.length>0&&x.length<=240;
function valid(s){return s&&(s.gpa===null||num(s.gpa,0,5))&&num(s.hours,0,999)&&Array.isArray(s.grades)&&s.grades.every(r=>Array.isArray(r)&&course(r[0])&&str(r[1])&&num(r[3],0.01,1000)&&num(r[2],0,r[3]))&&Array.isArray(s.schedule)&&s.schedule.every(r=>Array.isArray(r)&&course(r[0])&&Number.isInteger(r[1])&&num(r[1],0,6)&&tm(r[2])&&tm(r[3])&&r[2]<r[3]&&str(r[4]))&&Array.isArray(s.events)&&s.events.every(r=>Array.isArray(r)&&course(r[0])&&str(r[1])&&/^\d{4}-\d\d-\d\d$/.test(r[2])&&Number.isFinite(Date.parse(r[2]))&&(!r[3]||tm(r[3]))&&typeof r[4]==='boolean')}
let data=blank(),tab=0,selected=0;function notice(t){el('status').textContent=t}
try{const stored=localStorage.getItem(key);if(stored){const x=JSON.parse(stored);if(valid(x))data=x}}catch{notice('الحفظ المحلي غير متاح. احتفظ بنسخة من بياناتك.')}
function save(){try{localStorage.setItem(key,JSON.stringify(data));notice('تم حفظ التعديل على هذا الجهاز.')}catch{notice('التعديل متاح لهذه الجلسة. انسخ بياناتك قبل الإغلاق.')}render()}
const fmt=n=>new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(n);
const options=(rows)=>rows.map((c,i)=>'<option value="'+i+'">'+esc(c)+'</option>').join('');
const names=courses.map(c=>c[1]);const dateNow=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Riyadh'}).format(new Date());
const sorted=()=>data.events.slice().sort((a,b)=>(a[2]+a[3]).localeCompare(b[2]+b[3]));
const sums=i=>data.grades.filter(r=>r[0]===i).reduce((a,r)=>[a[0]+r[2],a[1]+r[3]],[0,0]);
const title=(i)=>esc(names[i])+' <small><bdi>'+courses[i][0]+'</bdi></small>';
function eventLine(r){return '<div class="event"><strong>'+esc(r[1])+'</strong><br><small>'+esc(names[r[0]])+' · <bdi>'+esc(r[2]+' '+r[3])+'</bdi></small></div>'}
function render(){const upcoming=sorted().filter(r=>!r[4]&&r[2]>=dateNow());el('next').textContent=upcoming.length?'أقرب موعد · '+upcoming[0][1]+' · '+upcoming[0][2]:'جدولك ودرجاتك ومواعيدك في مكان واحد';
el('metrics').innerHTML=[['المعدل التراكمي',data.gpa===null?'—':fmt(data.gpa)+' / ٥'],['الساعات المجتازة',fmt(data.hours)],['ساعات الفصل',fmt(courses.reduce((n,c)=>n+c[2],0))],['المواعيد القادمة',fmt(upcoming.length)]].map(r=>'<article><small>'+r[0]+'</small><strong>'+r[1]+'</strong></article>').join('');
el('tabs').innerHTML=tabs.map((t,i)=>'<button aria-current="'+(tab===i)+'" data-tab="'+i+'">'+t+'</button>').join('');
const screen=el('screen');
if(tab===0){screen.innerHTML='<section class="panel"><h2>المواعيد القادمة</h2>'+(upcoming.slice(0,3).map(eventLine).join('')||'<p class="muted">أضف موعدًا من قسم المواعيد.</p>')+'</section><section class="panel"><h2>درجاتي المرصودة</h2><div class="cards">'+courses.slice(0,7).map((c,i)=>{const [g,m]=sums(i);return '<article><small>'+c[0]+'</small><br><strong>'+c[1]+'</strong><p class="accent">'+(m?fmt(g)+' من '+fmt(m):'بانتظار الرصد')+'</p>'+(m?'<progress value="'+g+'" max="'+m+'"></progress>':'')+'</article>'}).join('')+'</div></section>';return}
if(tab===1){const rows=data.grades.map((r,i)=>r[0]===selected?'<tr><td>'+esc(r[1])+'</td><td>'+fmt(r[2])+' من '+fmt(r[3])+'</td><td><button data-remove="'+i+'">حذف</button></td></tr>':'').join('');screen.innerHTML='<section class="panel"><h2>دفتر الدرجات</h2><select id="course" aria-label="المادة">'+options(names)+'</select><p>'+title(selected)+' · '+fmt(courses[selected][2])+' ساعات</p><p class="muted">'+weights[selected]+'</p><table><tbody>'+rows+'</tbody></table><form id="grade" class="tools"><label>البند<input name="label" required maxlength="100"></label><label>درجتي<input name="earned" type="number" min="0" step="any" required></label><label>من<input name="max" type="number" min=".01" step="any" required></label><button class="primary">إضافة درجة</button></form></section>';el('course').value=selected;el('course').onchange=e=>{selected=+e.target.value;render()};el('grade').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v=+f.get('earned'),m=+f.get('max'),n=f.get('label').trim();if(!n||v>m||m>1000)return notice('تحقق من اسم البند والدرجة القصوى.');data.grades.push([selected,n,v,m]);save()};return}
if(tab===2){screen.innerHTML='<div class="cards">'+days.filter((_,j)=>j<5||data.schedule.some(r=>r[1]===j)).map(d=>'<article><h2>'+d+'</h2>'+ (data.schedule.filter(r=>r[1]===days.indexOf(d)).sort((a,b)=>a[2].localeCompare(b[2])).map(r=>'<div class="event"><bdi>'+esc(r[2]+' – '+r[3])+'</bdi><br>'+esc(names[r[0]])+'<br><small>'+esc(r[4])+'</small></div>').join('')||'<small>لا توجد محاضرات مسجّلة</small>')+'</article>').join('')+'</div><section class="panel"><h2>إضافة محاضرة</h2><form id="session" class="tools"><label>المادة<select name="i">'+options(names)+'</select></label><label>اليوم<select name="d">'+options(days)+'</select></label><label>من<input name="a" type="time" required></label><label>إلى<input name="b" type="time" required></label><label>القاعة أو طريقة الحضور<input name="p" required maxlength="80"></label><button class="primary">حفظ المحاضرة</button></form></section>';el('session').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),r=[+f.get('i'),+f.get('d'),f.get('a'),f.get('b'),f.get('p').trim()];if(r[2]>=r[3]||!r[4])return notice('تحقّق من الوقت والقاعة.');data.schedule.push(r);save()};return}
if(tab===3){screen.innerHTML='<section class="panel"><h2>الاختبارات والتسليمات</h2>'+sorted().map(r=>'<div class="row">'+eventLine(r)+'<button data-done="'+data.events.indexOf(r)+'">'+(r[4]?'تم الإنجاز ✓':'تحديد كمكتمل')+'</button></div>').join('')+'<form class="tools" id="event"><label>المادة<select name="course">'+options(names)+'</select></label><label>الموعد<input name="label" required maxlength="120"></label><label>التاريخ<input name="date" type="date" required></label><label>الوقت<input name="time" type="time"></label><button class="primary">إضافة موعد</button></form></section>';el('event').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),n=f.get('label').trim();if(!n)return;data.events.push([+f.get('course'),n,f.get('date'),f.get('time'),false]);save()};return}
screen.innerHTML='<section class="panel"><h2>كم أحتاج في الفاينل؟</h2><div class="tools"><label>المادة<select id="fc">'+options(names.slice(0,7))+'</select></label><label>هدفك من ١٠٠<input id="goal" type="number" min="0" max="100" value="90"></label><label>وزن الفاينل<input id="weight" type="number" min="1" max="100"></label><label>درجات الأعمال المتبقية المتوقعة<input id="extra" type="number" min="0" value="0" step="any"></label></div><p id="needed" class="accent"></p></section><section class="panel"><h2>محاكاة المعدل التراكمي</h2><div class="tools"><label>معدلك السابق<input id="prior" type="number" min="0" max="5" step=".01" value="'+(data.gpa??'')+'"></label><label>ساعات المعدل السابقة<input id="credits" type="number" min="0" value="'+data.hours+'"></label></div><div class="cards">'+courses.slice(0,7).map((c,i)=>'<label>'+c[1]+'<select class="prediction"><option value="">اختر التقدير</option>'+levels.map(l=>'<option value="'+l[1]+'">'+l[0]+'</option>').join('')+'</select></label>').join('')+'</div><p class="accent" id="projection"></p></section>';
function calc(){const i=+el('fc').value,[g,m]=sums(i),w=el('weight').valueAsNumber,t=el('goal').valueAsNumber,e=el('extra').valueAsNumber,need=Math.max(0,t-g-e);el('needed').textContent=!(num(w,1,100)&&num(t,0,100)&&num(e,0,100-w-m))?'تحقّق من وزن الفاينل ودرجات الأعمال المتبقية.':need>w?'الهدف أعلى من المتاح بهذا السيناريو.':'تحتاج '+fmt(need)+' من '+fmt(w)+' في الفاينل، بافتراض كسب '+fmt(e)+' من الأعمال المتبقية.'}
function project(){let pts=0,h=0;document.querySelectorAll('.prediction').forEach((s,i)=>{if(s.value){h+=courses[i][2];pts+=courses[i][2]*Number(s.value)}});const p=el('prior').valueAsNumber,c=el('credits').valueAsNumber;el('projection').textContent=h&&num(p,0,5)&&num(c,0,999)?'المعدل المتوقع '+fmt((p*c+pts)/(c+h))+' من ٥ بعد احتساب '+fmt(h)+' ساعة محددة.':'أدخل المعدل والساعات واختر تقدير مادة واحدة على الأقل.'}
el('fc').onchange=()=>{el('weight').value=courses[+el('fc').value][3]??'';el('extra').value=0;calc()};el('fc').onchange();screen.oninput=()=>{if(tab===4){calc();project()}};project()}
document.addEventListener('click',e=>{const d=e.target.dataset;if(d.tab!==undefined){tab=+d.tab;render()}if(d.remove!==undefined&&confirm('حذف هذا البند؟')){data.grades.splice(+d.remove,1);save()}if(d.done!==undefined){data.events[+d.done][4]=!data.events[+d.done][4];save()}});

const weights=['ميد ٢٥ · كويزات ١٥ · لابات ٢٠ · فاينل ٤٠','ميد ٢٥ · كويزات ١٥ · مشروع ٢٠ · فاينل ٤٠','ميد ٣٠ · أعمال فصل ٣٠ · فاينل ٤٠','ميد ٣٠ · أعمال فصل ٣٠ · فاينل ٤٠','ميد ٣٠ · أعمال فصل ٣٠ · فاينل ٤٠','تُعرض البنود المرصودة حسب الشعبة','ميد ٤٠ · واجبات ٢٠ · فاينل ٤٠','متطلب دون ساعات'];
const gradeLabels=['الميد','كويز ١','كويز ٢','واجب ١','واجب ٢','واجب ٣','واجب ٤','واجبات مرصودة'];
function unpack(t){
 const parts=t.trim().split('|');if(parts.length!==5)throw Error();
 const s=blank();[s.gpa,s.hours]=parts[1].split(',').map(Number);
 parts[2].trim().split(/\s+/).forEach(item=>{const [i,k,v,m]=item.split(':').map(Number);s.grades.push([i,gradeLabels[k],v,m])});
 const clock=t=>t.slice(0,2)+':'+t.slice(2);
 parts[3].trim().split(/\s+/).forEach(item=>{const [i,ds,a,b,place]=item.split(':');for(const d of ds)s.schedule.push([+i,+d,clock(a),clock(b),place==='R'?'عن بُعد':place])});
 parts[4].trim().split(';').forEach(item=>{const [i,n,d,t]=item.trim().split('~');s.events.push([+i,n,d,t||'',false])});return s
}
function importText(text){text=text.trim();let x=text.startsWith('UJ1|')?unpack(text):JSON.parse(text);if(!valid(x))throw Error();return x}
el('restore').onclick=()=>{try{const x=importText(el('config').value);if((data.grades.length||data.events.length||data.schedule.length)&&!confirm('استبدال البيانات الحالية؟'))return;data=x;el('config').value='';save();el('settings').open=false}catch{notice('تعذّر قراءة الإعداد. انسخ النص كاملًا.')}};
el('backup').onclick=()=>{el('config').value=JSON.stringify(data);el('config').select()};
if(location.hash.startsWith('#setup=')){try{const incoming=importText(decodeURIComponent(location.hash.slice(7)));if(!data.grades.length&&!data.schedule.length&&!data.events.length){data=incoming;save()}else{el('config').value=JSON.stringify(incoming);el('settings').open=true}history.replaceState(null,'',location.pathname+location.search)}catch{notice('تحقق من رابط الإعداد.')}}render();
</script></html>
